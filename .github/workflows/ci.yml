name: Investment Research System CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - run: npm run build
      - run: python -m py_compile backend/app.py
      - run: python -c "import backend.app; print('database initialized')"
      - run: python -m ml.tests.test_point_in_time
      - run: python -m ml.tests.test_inference_contract
