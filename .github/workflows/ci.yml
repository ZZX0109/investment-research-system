name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,train]"
      - run: python -m compileall -q src scripts
      - run: python scripts/build_competition_demo_fixtures.py
      - run: python scripts/seed_competition_knowledge.py
      - run: python -m pytest -q
      - run: python scripts/run_cn_research_demo.py --dry-run

  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
