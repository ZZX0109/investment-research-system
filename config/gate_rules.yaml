# Production gate rules — loaded by promotion.py
# Version: 1.0

promotion_gate:
  primary_metric: "top_bucket_drawdown_lift"
  minimum_primary_metric_delta: 0.05
  min_drawdown_lift: 0.0
  minimum_alert_precision: 0.50             # alert precision in top bucket
  minimum_auroc: 0.68
  max_ece: 0.15                             # expected calibration error
  max_brier_delta_vs_baseline: 0.01
  max_market_auroc_drop_vs_baseline: 0.03
  max_coverage_group_auroc_drop_vs_baseline: 0.03
  minimum_coverage_group_validation_prediction_count: 50
  minimum_positive_regime_count: 3
  recent_window_count: 2

  require_models: ["xgboost", "lightgbm"]
  require_models_mode: "any"

  # Audit constraints
  minimum_target_label_availability_ratio: 0.6
  minimum_reference_feature_backed_ratio: 0.6
  minimum_samples_with_events_ratio: 0.05
  maximum_potential_future_leakage_issue_count: 0
  maximum_samples_with_data_issues_ratio: 0.4

  # Regime requirements
  minimum_required_regime_validation_prediction_count: 50
  required_regimes: ["bull", "bear", "range", "high_vol"]

deep_model_gate:
  eligible_condition:
    regime_count_min: 2                     # must beat in ≥ 2 regimes
    auroc_delta_min: 0.03                   # vs best tabular per regime
  deep_model_families: ["patchtst", "tcn", "itransformer"]
  fallback_status: "research_only"          # status when not eligible

tuning:
  max_iterations: 20                        # max tuning attempts
  dimensions:
    - name: class_weight
      values: ["balanced", "none", {0: 1, 1: 3}, {0: 1, 1: 5}]
    - name: calibration
      values: ["isotonic", "platt", "none"]
    - name: risk_bucket_pct
      values: [5, 10, 20]
    - name: feature_correlation_threshold
      values: [0.7, 0.85, 0.95]
  stop_on_first_pass: true
