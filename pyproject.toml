[project]
name = "investment-research-console"
version = "0.1.0"
description = "Domain-first scaffold for a personal investment AI research system."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "apscheduler>=3.10.0,<4.0.0",
  "alembic>=1.16.0,<2.0.0",
  "bcrypt>=4.1.0,<5.0.0",
  "cryptography>=45.0.0,<47.0.0",
  "fastapi>=0.116.0,<1.0.0",
  "joblib>=1.3.0,<2.0.0",
  "pillow>=10.0.0,<13.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "pyjwt>=2.10.0,<3.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pyyaml>=6.0.0,<7.0.0",
  "scikit-learn>=1.3.0,<2.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
  "boto3>=1.35.0,<2.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "uvicorn>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  # Starlette 1.x TestClient uses the maintained httpx2 transport.  Pinning
  # it here keeps a clean editable-install test environment warning-free.
  "httpx2>=2.7.0,<3.0.0",
  "pytest>=8.4.0,<9.0.0",
]
train = [
  "pyarrow>=16.0.0,<24.0.0",
  "yfinance>=0.2.0,<1.0.0",
  "akshare>=1.15.0,<2.0.0",
  "baostock>=0.8.9,<1.0.0",
  "exchange-calendars>=4.5,<5.0",
  "pandas>=2.0.0,<3.0.0",
  "lightgbm>=4.0.0,<5.0.0",
  "catboost>=1.2.0,<2.0.0",
  "xgboost>=2.0.0,<3.0.0",
  "torch>=2.0.0,<3.0.0",
]
documents = [
  "pymupdf>=1.24.0,<2.0.0",
  "pdfplumber>=0.11.0,<1.0.0",
  "pytesseract>=0.3.10,<1.0.0",
  "python-docx>=1.1.0,<2.0.0",
]
knowledge = [
  "sentence-transformers>=3.0.0,<6.0.0",
  "python-docx>=1.1.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Keep the installed application package and repository-owned command modules
# importable for both `pytest` and `python -m pytest`.  The console-script
# executable does not automatically prepend the working directory in every
# environment, whereas `python -m pytest` does.
pythonpath = [".", "src"]
testpaths = ["tests"]
# PyMuPDF 1.28's generated SWIG runtime emits this CPython shutdown-only
# warning after otherwise successful document tests.  Keep the suppression
# exact so application RuntimeWarning/DeprecationWarning signals remain visible.
filterwarnings = [
  "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
